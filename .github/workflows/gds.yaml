name: gds

on:
  push:
  workflow_dispatch:

jobs:
  gds:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GDS
        uses: TinyTapeout/tt-gds-action@ttgf26c
        with:
          pdk: gf180mcuD

      # Print the timing summary and the worst setup paths into the job log
      - name: Timing report
        if: always()
        shell: bash
        run: |
          for d in $(find runs/wokwi -maxdepth 1 -type d -name '*stapostpnr*' | sort | tail -1); do
            find "$d" -name 'summary.rpt' -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
            for c in nom_tt_025C_3v30 nom_ss_125C_3v00; do
              f=$(find "$d/$c" -name 'max.rpt' 2>/dev/null | head -1)
              [ -n "$f" ] && { echo "== $f"; head -n 120 "$f"; }
            done
          done

  precheck:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: Run Tiny Tapeout Precheck
        uses: TinyTapeout/tt-gds-action/precheck@ttgf26c

  gl_test:
    needs: gds
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repo
        uses: actions/checkout@v6
        with:
          submodules: recursive

      # The tests compile RV32E programs (C + riscv-tests) at run time
      - name: Install RISC-V toolchain
        shell: bash
        run: sudo apt-get update && sudo apt-get install -y gcc-riscv64-unknown-elf picolibc-riscv64-unknown-elf

      - name: GL test
        uses: TinyTapeout/tt-gds-action/gl_test@ttgf26c

  viewer:
    needs: gds
    runs-on: ubuntu-24.04
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source
    steps:
      - uses: TinyTapeout/tt-gds-action/viewer@ttgf26c
